[package]
name = "pgtui"
version = "0.1.0"
edition = "2024"

[dependencies]

ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
chrono = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tui-textarea = "0.7.0"
dotenv = "0.15"